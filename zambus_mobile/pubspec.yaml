name: zambus_mobile
description: ZamBus - Smart Digital Intercity Bus Management System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # State Management - Bloc
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  equatable: ^2.0.5
  
  # Networking
  dio: ^5.4.0
  
  # Local Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0
  
  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^4.0.0
  
  # Maps - OpenStreetMap
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  
  # UI Components
  cached_network_image: ^3.3.0
  flutter_svg: ^2.0.9
  percent_indicator: ^4.2.3
  
  # PDF viewing
  pdfx: ^2.0.0
  
  # Date formatting
  intl: ^0.19.0
  
  # File handling
  open_file: ^3.3.0
  
  # Path
  path_provider: ^2.1.2
  
  # Dependency Injection
  get_it: ^7.6.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  bloc_test: ^9.1.4
  mocktail: ^1.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
